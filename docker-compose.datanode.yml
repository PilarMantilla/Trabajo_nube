services:
  datanode:
    build: ./datanode
    ports:
      - "${NODE_PORT:-8001}:8001"
    environment:
      NODE_ID: ${NODE_ID:?Set unique NODE_ID, for example dn1}
      NAMENODE_URL: ${NAMENODE_URL:?Set https://DNS-or-IP-control:8000}
      NAMENODE_INTERNAL_URL: ${NAMENODE_URL:?Set https://DNS-or-IP-control:8000}
      NODE_INTERNAL_URL: ${NODE_INTERNAL_URL:?Set https://DNS-or-IP-node:8001}
      NODE_EXTERNAL_URL: ${NODE_EXTERNAL_URL:?Set a client-reachable HTTPS URL}
      BLOCK_SIZE: ${DFS_BLOCK_SIZE:-8388608}
      DFS_TOKEN_SECRET: ${DFS_TOKEN_SECRET:?Set the same DFS_TOKEN_SECRET}
      DFS_INTERNAL_SECRET: ${DFS_INTERNAL_SECRET:?Set the same DFS_INTERNAL_SECRET}
      TLS_CERTFILE: /certs/server.crt
      TLS_KEYFILE: /certs/server.key
      TLS_CA_BUNDLE: /certs/ca.crt
    volumes:
      - ./data/runtime/${NODE_ID:?Set NODE_ID}:/blocks
      - ./certs:/certs:ro
    restart: unless-stopped
